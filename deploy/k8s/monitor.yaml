# kubectl apply -f deploy/k8s
# Create these Secrets before the pods start. This folder does not contain secret values.
#   api-monitor-mcp-token   key token   REQUIRED for the MCP proxy. A read-scoped API token.
#   api-monitor-secrets                 OPTIONAL. Probe passwords as env vars named by secretRef.
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-monitor-config
  namespace: api-monitor
data:
  PORT: "3000"
  DB_PATH: /data/api-monitor.db
  NODE_ENV: production
  AUTH_MODE: disabled
  ENABLED_PROBES: http
  MCP_ENABLED: "true"
  MCP_ONLY: "false"
  STATUS_BASE_URL: http://api-monitor:3000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: api-monitor-data
  namespace: api-monitor
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-monitor
  namespace: api-monitor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: api-monitor
  template:
    metadata:
      labels:
        app: api-monitor
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api-monitor
          image: api-monitor:local
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: api-monitor-config
            - secretRef:
                name: api-monitor-secrets
                optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: api-monitor-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api-monitor
  namespace: api-monitor
spec:
  selector:
    app: api-monitor
  ports:
    - name: http
      port: 3000
      targetPort: http
