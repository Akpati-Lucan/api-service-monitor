# kubectl apply -f deploy/k8s
# Required Secret: api-monitor-mcp-token key token — read-scoped bearer token sent to the monitor.
# Optional Secret: api-monitor-secrets — probe passwords. The monitor accepts them. This proxy does not.
# Do not scale the api-monitor Deployment. This proxy is the only workload that may autoscale.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-monitor-mcp
  namespace: api-monitor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-monitor-mcp
  template:
    metadata:
      labels:
        app: api-monitor-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: mcp
          image: api-monitor:local
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: production
            - name: MCP_ONLY
              value: "true"
            - name: MCP_ENABLED
              value: "true"
            - name: MONITOR_BASE_URL
              value: http://api-monitor:3000
            - name: MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: api-monitor-mcp-token
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api-monitor-mcp
  namespace: api-monitor
spec:
  selector:
    app: api-monitor-mcp
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-monitor-mcp
  namespace: api-monitor
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api-monitor-mcp
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-monitor-mcp
  namespace: api-monitor
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-monitor-mcp
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
