# kubectl apply -f deploy/k8s
# Required Secret: api-monitor-mcp-token key token
# Optional Secret: api-monitor-secrets
# Monitor pods accept TCP 3000 from the MCP pods and from pods labeled role=operator.
# MCP pods accept TCP 3000 from namespaces labeled mcp-client=allowed.
# MCP pods egress to the monitor Service and to DNS (port 53). Monitor egress stays open.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-monitor
  namespace: api-monitor
spec:
  podSelector:
    matchLabels:
      app: api-monitor
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-monitor-mcp
        - podSelector:
            matchLabels:
              role: operator
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-monitor-mcp
  namespace: api-monitor
spec:
  podSelector:
    matchLabels:
      app: api-monitor-mcp
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              mcp-client: allowed
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: api-monitor
      ports:
        - protocol: TCP
          port: 3000
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
